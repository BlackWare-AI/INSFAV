plugins { id 'com.android.application' }
android {
    namespace 'com.instagram.insfav'
    compileSdk 35
    defaultConfig { applicationId 'com.instagram.insfav'; minSdk 26; targetSdk 35; versionCode 1; versionName '3.0.0' }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('INSFAV_KEYSTORE')) {
                storeFile file(System.getenv('INSFAV_KEYSTORE'))
                storePassword System.getenv('INSFAV_STORE_PASSWORD')
                keyAlias System.getenv('INSFAV_KEY_ALIAS') ?: 'insfav'
                keyPassword System.getenv('INSFAV_KEY_PASSWORD') ?: System.getenv('INSFAV_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { versionNameSuffix '-debug' }
        release { if (System.getenv('INSFAV_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
