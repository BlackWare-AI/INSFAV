name: Verify and build restored profile placeholder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run web && git diff --exit-code -- app/src/main/assets tools/web-bundle.json web/maps
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install chromium
          browser_path="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          ldd "$browser_path" | tee browser-dependencies.txt
          if grep -q 'not found' browser-dependencies.txt; then npx playwright install-deps chromium; fi
      - name: Verify placeholder and existing layout
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          node tests/matrix-language.cjs | tee matrix-results.txt
      - run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-avatar-build
          path: |
            matrix-results.txt
            app/build/outputs/apk/release/
