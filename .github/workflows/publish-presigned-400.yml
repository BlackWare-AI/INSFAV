name: Publish verified signed INSFAV 4.0.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-presigned-400.yml'
permissions:
  contents: read
concurrency:
  group: insfav-official-release-v4.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source provenance, signed APK and upload before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSFAV_RELEASE_CERT_SHA256: a3058fab8d03c1549abb04ae4660ff2256296967e6291bd7a751ecb9b32e82c2
        shell: bash
        run: |
          set -euo pipefail
          source_commit=1bfdd3842e9df51046f5075b210c6f737d6a3c4d
          test "$(gh api "repos/$GH_REPO/actions/runs/39547301428" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/39547301428" --jq .head_sha)" = "$source_commit"
          test "$(gh api "repos/$GH_REPO/actions/runs/39547301450/jobs" --jq '.jobs[] | select(.name == "verify") | .conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/39547301450" --jq .head_sha)" = "$source_commit"
          git diff --exit-code "$source_commit" HEAD -- app web version.properties build.gradle settings.gradle gradle gradlew gradlew.bat
          if gh release view v4.0.0 >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/v4.0.0" >/dev/null 2>&1; then
            echo '::error::v4.0.0 exists; refusing to replace a release or tag.'
            exit 1
          fi
          mkdir downloaded
          gh api "repos/$GH_REPO/git/blobs/e181f6a99bda4ad8d73114e1e2f9ad5653942a26" --jq .content | base64 --decode > downloaded/INSFAV-4.0.0.apk
          echo 'fa8f63dbf1b773bac113144c3730d0ceee1e48a3789c960e282043a8c4167b78  downloaded/INSFAV-4.0.0.apk' | sha256sum --check
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import release_gate
          env = dict(os.environ, GITHUB_SHA='1bfdd3842e9df51046f5075b210c6f737d6a3c4d')
          release_gate.verify(Path('downloaded/INSFAV-4.0.0.apk'), Path('candidate'), env)
          record = json.loads(Path('candidate/verification.json').read_text())
          record.update(releaseCommit=os.environ['GITHUB_SHA'], buildRun=39547301428,
                        testRun=39547301450, previousDebugUpdateCompatible=False)
          Path('candidate/verification.json').write_text(json.dumps(record, indent=2) + '\n')
          note = ('\n## Installation certificate\n\n'
                  'This APK uses the existing BlackWare release key. Its certificate differs from previously supplied CI debug APKs; it cannot update those installations in place. '
                  'The user explicitly chose to publish this release independently of debug-update compatibility. No new signing key was generated. '
                  'The signed APK was built from commit `1bfdd3842e9df51046f5075b210c6f737d6a3c4d`; application source is identical to the release tag.\n')
          with Path('candidate/RELEASE-NOTES.md').open('a') as output:
              output.write(note)
          PY
          cd candidate
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create v4.0.0 INSFAV-4.0.0.apk SHA256SUMS signing-certificate.txt verification.json \
            --draft --target "$GITHUB_SHA" --title 'INSFAV 4.0.0' --notes-file RELEASE-NOTES.md
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-published.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v4.0.0 --dir "$verify_dir" --pattern INSFAV-4.0.0.apk
          (cd "$verify_dir" && sha256sum --check "$GITHUB_WORKSPACE/candidate/SHA256SUMS")
          gh release edit v4.0.0 --draft=false --latest
          gh release view v4.0.0 --json url --jq .url
