name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: node --test tests/core.test.cjs
      - run: |
          mkdir -p /tmp/insfav-parser
          javac -d /tmp/insfav-parser app/src/main/java/com/instagram/insfav/ProfileParser.java tests/java/com/instagram/insfav/ProfileParserTest.java
          java -cp /tmp/insfav-parser com.instagram.insfav.ProfileParserTest
      - run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: INSFAV-builds
          path: app/build/outputs/apk/
