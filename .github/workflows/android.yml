name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run web
      - run: git diff --exit-code -- app/src/main/assets tools/web-bundle.json web/maps
      - run: node --test tests/core.test.cjs
      - run: |
          mkdir -p /tmp/insfav-policy
          javac -d /tmp/insfav-policy app/src/main/java/com/instagram/insfav/ThumbnailPolicy.java tests/java/com/instagram/insfav/ThumbnailPolicyTest.java
          java -cp /tmp/insfav-policy com.instagram.insfav.ThumbnailPolicyTest
      - run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Web UI and counter regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          export CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          node tests/browser.cjs | tee browser-results.txt
          node tests/probe-browser.cjs | tee probe-results.txt
          mkdir -p /tmp/insfav-baseline
          for name in index.html app.js core.js style.css fonts.css; do git show e6c7e688617cc056dbb6dfc216c089060c51c86e:app/src/main/assets/$name > /tmp/insfav-baseline/$name; done
          BASELINE_ASSETS=/tmp/insfav-baseline BASELINE_REF=e6c7e688617cc056dbb6dfc216c089060c51c86e node tests/about-counters.cjs | tee counter-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-builds
          path: |
            browser-results.txt
            probe-results.txt
            counter-results.txt
            app/build/outputs/apk/
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            app/build/reports/tests/

  emulator:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: INSFAV-builds
          path: builds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: bash tools/emulator-pool.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-emulator-pool
          path: emulator-pool/
