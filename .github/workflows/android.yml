name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run web
      - run: git diff --exit-code -- app/src/main/assets tools/web-bundle.json web/maps
      - run: node --test tests/core.test.cjs
      - run: |
          mkdir -p /tmp/insfav-policy
          javac -d /tmp/insfav-policy app/src/main/java/com/instagram/insfav/ThumbnailPolicy.java tests/java/com/instagram/insfav/ThumbnailPolicyTest.java
          java -cp /tmp/insfav-policy com.instagram.insfav.ThumbnailPolicyTest
      - run: gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-builds
          path: |
            app/build/outputs/apk/
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            app/build/reports/tests/
