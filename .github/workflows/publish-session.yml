name: Publish Instagram session update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/instagram-session.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      INSFAV_KEYSTORE_BASE64: ${{ secrets.INSFAV_KEYSTORE_BASE64 }}
      INSFAV_STORE_PASSWORD: ${{ secrets.INSFAV_STORE_PASSWORD }}
      INSFAV_KEY_ALIAS: ${{ secrets.INSFAV_KEY_ALIAS }}
      INSFAV_KEY_PASSWORD: ${{ secrets.INSFAV_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require the existing signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in INSFAV_KEYSTORE_BASE64 INSFAV_STORE_PASSWORD INSFAV_KEY_ALIAS INSFAV_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing required existing signing secret: $name" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$INSFAV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/session-release.jks"
          test -s "$RUNNER_TEMP/session-release.jks"
          echo "INSFAV_KEYSTORE=$RUNNER_TEMP/session-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        shell: bash
        run: |
          if ! ./gradlew :app:lintRelease :app:assembleRelease --no-daemon --console=plain > "$RUNNER_TEMP/signing-build.log" 2>&1; then
            echo 'Release build or lint failed; signing output withheld to protect existing key material.' >&2
            exit 1
          fi
      - name: Verify package, version and signing certificate continuity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.instagram.insfav' versionCode='11' versionName='5.0.0'" "$RUNNER_TEMP/badging.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/current-cert.txt"
          mkdir previous
          gh release download v5.0.0-build.10-fetcher-bottom --pattern '*.apk' --dir previous
          prior=$(find previous -name '*.apk' -print -quit)
          "$tools/apksigner" verify --verbose --print-certs "$prior" > "$RUNNER_TEMP/previous-cert.txt"
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/current-cert.txt" > current-cert.txt
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/previous-cert.txt" > previous-cert.txt
          diff -u previous-cert.txt current-cert.txt
          cp "$apk" INSFAV-5.0.0-build11.apk
          sha256sum INSFAV-5.0.0-build11.apk > SHA256SUMS
      - name: Publish only the verified session update
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v5.0.0-build.11-session >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite.'; exit 1; fi
          gh release create v5.0.0-build.11-session INSFAV-5.0.0-build11.apk SHA256SUMS --target "$GITHUB_SHA" --title 'INSFAV 5.0.0 (build 11)' --notes-file INSTAGRAM-SESSION-RELEASE.md
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/session-release.jks"
