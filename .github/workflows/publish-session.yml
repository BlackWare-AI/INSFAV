name: Publish verified INSFAV update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-session.yml', 'version.properties']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/instagram-session.yml
  android-checks:
    uses: ./.github/workflows/android.yml
  publish:
    needs: [checks, android-checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      INSFAV_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      INSFAV_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      INSFAV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      INSFAV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read and validate version.properties
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Require the existing signing key
        shell: bash
        run: |
          set -euo pipefail
          for binding in KEYSTORE_BASE64:INSFAV_KEYSTORE_BASE64 KEYSTORE_PASSWORD:INSFAV_STORE_PASSWORD KEY_ALIAS:INSFAV_KEY_ALIAS KEY_PASSWORD:INSFAV_KEY_PASSWORD; do
            secret_name=${binding%%:*}
            input_variable=${binding#*:}
            if [[ -z "${!input_variable}" ]]; then echo "Required repository signing secret is unavailable: $secret_name" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$INSFAV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/session-release.jks"
          test -s "$RUNNER_TEMP/session-release.jks"
          echo "INSFAV_KEYSTORE=$RUNNER_TEMP/session-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        shell: bash
        run: |
          if ! ./gradlew :app:lintRelease :app:assembleRelease --no-daemon --console=plain > "$RUNNER_TEMP/signing-build.log" 2>&1; then
            echo 'Release build or lint failed; signing output withheld to protect existing key material.' >&2
            exit 1
          fi
      - name: Verify package, version and owner-approved signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.instagram.insfav' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" "$RUNNER_TEMP/badging.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/current-cert.txt"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          report=(Path(os.environ['RUNNER_TEMP'])/'current-cert.txt').read_text()
          fingerprints=re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)',report)
          # Owner explicitly approved replacing the previous release identity.
          assert fingerprints==['8c0dbdeea6c381fe6cbad23931d86c4e74792f324cf02cd52b26678273dac808'],'APK must use the owner-approved signing certificate'
          print('Owner-approved signing certificate verified')
          PY
          apk_name="INSFAV-${VERSION_NAME}-build${VERSION_CODE}.apk"
          cp "$apk" "$apk_name"
          sha256sum "$apk_name" > SHA256SUMS
      - name: Publish only the verified session update
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tag="v${VERSION_NAME}-build.${VERSION_CODE}"
          apk_name="INSFAV-${VERSION_NAME}-build${VERSION_CODE}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then echo 'Release already exists; refusing to overwrite.'; exit 1; fi
          gh release create "$tag" "$apk_name" SHA256SUMS --target "$GITHUB_SHA" --title "INSFAV ${VERSION_NAME} (build ${VERSION_CODE})" --generate-notes
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/session-release.jks"
