name: Publish same-version build 10 matrix, language and manual retrieval
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-matrix-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source, signed artifact and unchanged build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/40002877188" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/40002877188" --jq .head_sha)" = 0f22a19613cbb7317b357c67bb69c1119376a530
          git diff --exit-code 0f22a19613cbb7317b357c67bb69c1119376a530 HEAD -- app web tests version.properties build.gradle settings.gradle gradle gradlew gradlew.bat package.json package-lock.json tools/minify.cjs tools/web-bundle.json
          git show 16eaa2b7eb652ee684a1ee8e10dc0f594b9af22c > public-candidate.zip
          echo 'e2caf4f05f6b0f230dfa6bc1d0f2393ae46f7f77d875611f184a89839b39ca1f  public-candidate.zip' | sha256sum --check
          unzip -q public-candidate.zip -d candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          mkdir previous
          gh release download v5.0.0-build.10-amoled-scroll --pattern INSFAV-5.0.0.apk --dir previous
          gh run download 40002877188 --name INSFAV-builds --dir ci
          gh run download 40002877188 --name INSFAV-emulator-pool --dir emulator
          python3 - <<'PY'
          import hashlib,json,os,subprocess,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as signing
          import update_build10 as manifest
          source='0f22a19613cbb7317b357c67bb69c1119376a530'
          cert='705e090084a4e50c47a8eb122d1605963276e5bb76f873d6f185b965c01e8641'
          record=json.loads(Path('candidate/verification.json').read_text())
          expected=dict(sourceCommit=source,version='5.0.0',build=10,apkSha256='6b53d37cbf174d79d9c56c624419977d4cc5dcf1d1ac70924bf35665d2da705a',certificateSha256=cert,nativeTests=dict(tests=231,failures=0,errors=0,skipped=0),coreTests=22,baselineBrowserChecks=134,scrollChecks=61,matrixChecks=69,deviceScrollChecks=True,ciRun=40002877188,ciConclusion='success',emulatorConclusion='success',physicalDeviceTested=False,liveInstagramTested=False,debuggable=False,lintErrors=0)
          assert all(type(record.get(k)) is type(v) and record[k]==v for k,v in expected.items()),'Unverified evidence'
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']);tools=sorted(sdk.glob('build-tools/*/apksigner'))[-1].parent
          for path,digest in [(Path('candidate/INSFAV-5.0.0.apk'),'6b53d37cbf174d79d9c56c624419977d4cc5dcf1d1ac70924bf35665d2da705a'),(Path('previous/INSFAV-5.0.0.apk'),'cca1a6d6c082e176cca4f36b5fd4271330ac3d998045dac0efa41c9f1a91ecc8')]:
              manifest.verify_hash(path,digest)
              assert signing.apk_certificate(tools/'apksigner',path)==cert
              manifest.validate_manifest(signing.captured([str(tools/'aapt'),'dump','badging',str(path)]))
          signing.captured([str(tools/'zipalign'),'-c','-P','16','4','candidate/INSFAV-5.0.0.apk'])
          assert Path('candidate/INSFAV-Android-Studio-Project.zip').read_bytes()==subprocess.check_output(['git','archive','--format=zip',source])
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:z.read(n) for n in z.namelist() if not n.endswith('/') and not (n.startswith('META-INF/') and (n.endswith(('.SF','.RSA','.DSA','.EC')) or n=='META-INF/MANIFEST.MF'))}
          assert payload('candidate/INSFAV-5.0.0.apk')==payload('ci/app/build/outputs/apk/release/app-release-unsigned.apk'),'Signed APK differs from verified CI payload'
          current=payload('candidate/INSFAV-5.0.0.apk');previous=payload('previous/INSFAV-5.0.0.apk')
          changed={name for name in set(current)|set(previous) if current.get(name)!=previous.get(name)}
          assert changed <= {'assets/app.js','assets/core.js','assets/style.css','assets/index.html','assets/i18n.js','assets/dexopt/baseline.prof','assets/dexopt/baseline.profm','classes.dex','META-INF/version-control-info.textproto'} and 'classes.dex' in changed,changed
          assert Path('ci/matrix-results.txt').read_text().splitlines()[-1]=='69 matrix/language checks passed'
          assert Path('ci/scroll-results.txt').read_text().splitlines()[-1]=='61 scroll and AMOLED checks passed'
          assert Path('candidate/scroll-ui.json').read_bytes()==Path('emulator/scroll-ui.json').read_bytes()
          assert Path('candidate/scroll-device-150.png').read_bytes()==Path('emulator/scroll-device-150.png').read_bytes()
          proof=json.loads(Path('candidate/scroll-ui.json').read_text())
          assert proof['fixture'] is True and proof['physicalDevice'] is False and proof['accounts']==4000 and proof['sdk']==34
          assert len(proof['results'])==3
          for result,scale in zip(proof['results'],[1,1.3,1.5]):
              assert abs(result['systemFontScale']-scale)<.01 and result['realTouchHoldAndDrag'] is True and result['globalStartEnd'] is True
              assert result['holdMilliseconds']==100 and result['gripWidth']==15
              assert len(result['matrix'])==4
              for grid,columns in zip(result['matrix'],[2,3,4,5]):
                  assert grid['columns']==columns and grid['squares'] and grid['labelsBelow'] and grid['labelsFit'] and grid['noNames'] and grid['noOverflow']
              layout=result['layout']
              assert layout['rowHeight']==68 and layout['avatarSize']==67.5 and layout['avatarRadius']=='14px' and layout['folderRadius']=='26px'
              assert layout['noTextOverlap'] is True and layout['horizontalOverflow'] is False
          PY
      - name: Upload verified draft and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/v5.0.0-build.10-matrix" > tag.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = 0f22a19613cbb7317b357c67bb69c1119376a530
          fi
          gh api "repos/$GH_REPO/releases/421918783" > draft.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('draft.json'))
          assert d['id']==421918783 and d['draft'] is True and d['tag_name']=='v5.0.0-build.10-matrix' and d['target_commitish']=='0f22a19613cbb7317b357c67bb69c1119376a530'
          assert all(a['name'] in {p.name for p in Path('candidate').iterdir()} for a in d['assets'])
          PY
          gh release upload v5.0.0-build.10-matrix candidate/* --clobber
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-matrix.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0-build.10-matrix --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/releases/tags/v5.0.0-build.10-amoled-scroll" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')" = 'sha256:cca1a6d6c082e176cca4f36b5fd4271330ac3d998045dac0efa41c9f1a91ecc8'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v5.0.0-build.10-matrix --notes-file candidate/RELEASE-NOTES.md --draft=false --latest
          gh release view v5.0.0-build.10-matrix --json url --jq .url
