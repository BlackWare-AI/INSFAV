name: Verify bottom-first fetcher queue
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint and release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease | tee verification-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-fetcher-bottom-build
          path: |
            verification-results.txt
            app/build/outputs/apk/release/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
