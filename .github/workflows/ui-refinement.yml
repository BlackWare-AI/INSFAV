name: Focused matrix and scrolling verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run web && git diff --exit-code -- app/src/main/assets tools/web-bundle.json web/maps
      - run: node --test tests/core.test.cjs | tee core-results.txt
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Install verified test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test changed matrix, preferences and scrolling
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p measurements
          export CHROME_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          MATRIX_SCREENSHOT=measurements/matrix-ui.png node tests/matrix-language.cjs | tee matrix-results.txt
          SCROLL_SCREENSHOT=measurements/scroll-ui.png node tests/scroll-controls.cjs | tee scroll-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-builds
          path: |
            measurements/
            core-results.txt
            matrix-results.txt
            scroll-results.txt
            app/build/outputs/apk/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
  emulator:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: INSFAV-builds
          path: builds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/emulator-ui-refinement.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: INSFAV-emulator-pool
          path: emulator-ui/
