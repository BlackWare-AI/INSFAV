name: Publish same-version build 10 68px sizing refinement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-avatar675-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a099d0a4b7def31b23ea3c1b5599a788240b304d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact source and rebuild unsigned release
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run web
          git diff --exit-code -- app/src/main/assets tools/web-bundle.json web/maps
          node --test tests/core.test.cjs
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.51.1
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser.cjs | tee browser-ci-results.txt
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify source, signed artifact and unchanged build
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code a099d0a4b7def31b23ea3c1b5599a788240b304d "$GITHUB_SHA" -- app web tests version.properties build.gradle settings.gradle gradle gradlew gradlew.bat package.json package-lock.json tools/minify.cjs tools/web-bundle.json
          git show 37f753ba37a64ab913f8c78e7680239e56c223b5 > public-candidate.zip
          echo 'd80671dadfdaf33380378c7cb1daa9f7c86753ee81eaf00c456c3b3d466a0bad  public-candidate.zip' | sha256sum --check
          unzip -q public-candidate.zip -d candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          mkdir previous
          gh release download v5.0.0-build.10-avatar70 --pattern INSFAV-5.0.0.apk --dir previous
          python3 - <<'PY'
          import hashlib,json,os,subprocess,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as signing
          import update_build10 as manifest
          source='a099d0a4b7def31b23ea3c1b5599a788240b304d'
          cert='705e090084a4e50c47a8eb122d1605963276e5bb76f873d6f185b965c01e8641'
          record=json.loads(Path('candidate/verification.json').read_text())
          expected=dict(sourceCommit=source,version='5.0.0',build=10,apkSha256='f7857f37fa021df8072192f8c487c1f05f503b99f18277690e8387520d8136d2',certificateSha256=cert,nativeTests=dict(tests=222,failures=0,errors=0,skipped=0),coreTests=12,browserChecks=134,emulatorTested=False,physicalDeviceTested=False,liveInstagramTested=False,debuggable=False,lintErrors=0)
          assert all(type(record.get(k)) is type(v) and record[k]==v for k,v in expected.items()),'Unverified evidence'
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']);tools=sorted(sdk.glob('build-tools/*/apksigner'))[-1].parent
          for path,digest in [(Path('candidate/INSFAV-5.0.0.apk'),'f7857f37fa021df8072192f8c487c1f05f503b99f18277690e8387520d8136d2'),(Path('previous/INSFAV-5.0.0.apk'),'7cdcbb5061349604229afead82f55d1d32fb693ace1b579096b3b4955eaf2e94')]:
              manifest.verify_hash(path,digest)
              assert signing.apk_certificate(tools/'apksigner',path)==cert
              manifest.validate_manifest(signing.captured([str(tools/'aapt'),'dump','badging',str(path)]))
          signing.captured([str(tools/'zipalign'),'-c','-P','16','4','candidate/INSFAV-5.0.0.apk'])
          assert Path('candidate/INSFAV-Android-Studio-Project.zip').read_bytes()==subprocess.check_output(['git','archive','--format=zip',source])
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:z.read(n) for n in z.namelist() if not n.endswith('/') and not (n.startswith('META-INF/') and (n.endswith(('.SF','.RSA','.DSA','.EC')) or n=='META-INF/MANIFEST.MF'))}
          assert payload('candidate/INSFAV-5.0.0.apk')==payload('app/build/outputs/apk/release/app-release-unsigned.apk'),'Signed APK differs from verified CI payload'
          import xml.etree.ElementTree as ET
          counts=dict(tests=0,failures=0,errors=0,skipped=0)
          for path in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root=ET.parse(path).getroot()
              for k in counts:counts[k]+=int(root.get(k,0))
          assert counts==dict(tests=222,failures=0,errors=0,skipped=0),counts
          lint=ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          assert not any(i.get('severity') in ('Error','Fatal') for i in lint.findall('issue'))
          assert Path('browser-ci-results.txt').read_text().splitlines()[-1]=='134 UI checks passed'
          record.update(ciVerificationPassed=True,publicationRun=int(os.environ['GITHUB_RUN_ID']),nativeTestsCI=counts,browserChecksCI=134,lintWarningsCI=sum(i.get('severity')=='Warning' for i in lint.findall('issue')),signedApkMatchesCiBuild=True)
          Path('candidate/verification.json').write_text(json.dumps(record,indent=2))
          Path('candidate/browser-ci-results.txt').write_bytes(Path('browser-ci-results.txt').read_bytes())
          Path('candidate/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(Path('candidate').iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - name: Upload verified draft and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/v5.0.0-build.10-avatar675" > tag.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = a099d0a4b7def31b23ea3c1b5599a788240b304d
          fi
          gh api "repos/$GH_REPO/releases/421489015" > draft.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('draft.json'))
          assert d['id']==421489015 and d['draft'] is True and d['tag_name']=='v5.0.0-build.10-avatar675' and d['target_commitish']=='a099d0a4b7def31b23ea3c1b5599a788240b304d'
          assert all(a['name'] in {p.name for p in Path('candidate').iterdir()} for a in d['assets'])
          PY
          gh release upload v5.0.0-build.10-avatar675 candidate/* --clobber
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-avatar675.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0-build.10-avatar675 --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/releases/tags/v5.0.0-build.10-avatar70" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')" = 'sha256:7cdcbb5061349604229afead82f55d1d32fb693ace1b579096b3b4955eaf2e94'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v5.0.0-build.10-avatar675 --draft=false --latest
          gh release view v5.0.0-build.10-avatar675 --json url --jq .url
