name: Publish same-version build 10 68px sizing refinement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insfav-avatar675-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'BlackWare-AI/INSFAV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source, signed artifact and unchanged build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/39907121831" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/39907121831" --jq .head_sha)" = a099d0a4b7def31b23ea3c1b5599a788240b304d
          git diff --exit-code a099d0a4b7def31b23ea3c1b5599a788240b304d HEAD -- app web tests version.properties build.gradle settings.gradle gradle gradlew gradlew.bat package.json package-lock.json tools/minify.cjs tools/web-bundle.json
          git show fd974199d31558e2d87deb44944ad4cea503014d > public-candidate.zip
          echo '2a74cdbdecc5126be1c9f54bddc0325edc30106670df8bd6c5491f8b84df0e1f  public-candidate.zip' | sha256sum --check
          unzip -q public-candidate.zip -d candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          mkdir previous
          gh release download v5.0.0-build.10-avatar70 --pattern INSFAV-5.0.0.apk --dir previous
          gh run download 39907121831 --name INSFAV-builds --dir ci
          python3 - <<'PY'
          import hashlib,json,os,subprocess,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools/release')
          import release_gate_500 as signing
          import update_build10 as manifest
          source='a099d0a4b7def31b23ea3c1b5599a788240b304d'
          cert='705e090084a4e50c47a8eb122d1605963276e5bb76f873d6f185b965c01e8641'
          record=json.loads(Path('candidate/verification.json').read_text())
          expected=dict(sourceCommit=source,version='5.0.0',build=10,apkSha256='f7857f37fa021df8072192f8c487c1f05f503b99f18277690e8387520d8136d2',certificateSha256=cert,nativeTests=dict(tests=222,failures=0,errors=0,skipped=0),coreTests=12,browserChecks=134,ciRun=39907121831,ciConclusion='success',emulatorConclusion='success',physicalDeviceTested=False,liveInstagramTested=False,debuggable=False,lintErrors=0)
          assert all(type(record.get(k)) is type(v) and record[k]==v for k,v in expected.items()),'Unverified evidence'
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']);tools=sorted(sdk.glob('build-tools/*/apksigner'))[-1].parent
          for path,digest in [(Path('candidate/INSFAV-5.0.0.apk'),'f7857f37fa021df8072192f8c487c1f05f503b99f18277690e8387520d8136d2'),(Path('previous/INSFAV-5.0.0.apk'),'7cdcbb5061349604229afead82f55d1d32fb693ace1b579096b3b4955eaf2e94')]:
              manifest.verify_hash(path,digest)
              assert signing.apk_certificate(tools/'apksigner',path)==cert
              manifest.validate_manifest(signing.captured([str(tools/'aapt'),'dump','badging',str(path)]))
          signing.captured([str(tools/'zipalign'),'-c','-P','16','4','candidate/INSFAV-5.0.0.apk'])
          assert Path('candidate/INSFAV-Android-Studio-Project.zip').read_bytes()==subprocess.check_output(['git','archive','--format=zip',source])
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:z.read(n) for n in z.namelist() if not n.endswith('/') and not (n.startswith('META-INF/') and (n.endswith(('.SF','.RSA','.DSA','.EC')) or n=='META-INF/MANIFEST.MF'))}
          assert payload('candidate/INSFAV-5.0.0.apk')==payload('ci/app/build/outputs/apk/release/app-release-unsigned.apk'),'Signed APK differs from verified CI payload'
          PY
      - name: Upload verified draft and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/v5.0.0-build.10-avatar675" > tag.json 2>/dev/null; then
            test "$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')" = a099d0a4b7def31b23ea3c1b5599a788240b304d
          fi
          gh api "repos/$GH_REPO/releases/421489015" > draft.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('draft.json'))
          assert d['id']==421489015 and d['draft'] is True and d['tag_name']=='v5.0.0-build.10-avatar675' and d['target_commitish']=='a099d0a4b7def31b23ea3c1b5599a788240b304d'
          assert all(a['name'] in {p.name for p in Path('candidate').iterdir()} for a in d['assets'])
          PY
          gh release upload v5.0.0-build.10-avatar675 candidate/* --clobber
          verify_dir=$(mktemp -d "$RUNNER_TEMP/insfav-avatar675.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download v5.0.0-build.10-avatar675 --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum --check SHA256SUMS)
          test "$(gh api "repos/$GH_REPO/releases/tags/v5.0.0-build.10-avatar70" --jq '.assets[] | select(.name == "INSFAV-5.0.0.apk") | .digest')" = 'sha256:7cdcbb5061349604229afead82f55d1d32fb693ace1b579096b3b4955eaf2e94'
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit v5.0.0-build.10-avatar675 --draft=false --latest
          gh release view v5.0.0-build.10-avatar675 --json url --jq .url
